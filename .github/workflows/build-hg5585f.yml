name: Build LEDE HG5585F (FiberHome CT)

# 触发方式：
#   1) 手动（可临时追加插件）
#   2) 推送改动 configs/ 或本工作流
#   3) 每周一 03:00 UTC 跟随上游 LEDE 更新
on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: '临时追加插件（空格分隔，如 luci-app-samba4）'
        required: false
        default: ''
      enable_npu_stats:
        description: '开启 NPU/PPE 流量统计'
        required: true
        type: boolean
        default: true
  push:
    branches: [main, master]
    paths:
      - 'configs/hg5585f.config'
      - '.github/workflows/build-hg5585f.yml'
  schedule:
    - cron: '0 3 * * 1'

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede.git
  LEDE_BRANCH: master
  CONFIG_FILE: configs/hg5585f.config
  DEVICE_SYMBOL: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct
  DEVICE_NAME: fiberhome_hg5585f-ct
  TZ: Asia/Shanghai

concurrency:
  group: lede-hg5585f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 LEDE HG5585F
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get -qq clean
          df -h /

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd

      - name: 拉取 LEDE 最新源码
        run: |
          git clone --depth 1 --branch "$LEDE_BRANCH" "$LEDE_REPO" lede
          cd lede
          echo "LEDE_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "LEDE_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          echo "上游: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"

      - name: 挂载第三方 feeds（最新 master）
        run: |
          cd lede
          add_feed() {
            grep -q "src-git $1 " feeds.conf.default || echo "src-git $1 $2" >> feeds.conf.default
          }
          add_feed qmodem https://github.com/FUjr/QModem.git
          add_feed openclash https://github.com/vernesong/OpenClash.git
          echo "----- feeds.conf.default -----"
          cat feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          cd lede
          ./scripts/feeds clean || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 缓存 dl 源码包
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: dl-lede-hg5585f-${{ github.run_id }}
          restore-keys: |
            dl-lede-hg5585f-
            dl-lede-

      - name: 应用配置
        run: |
          cd lede

          # ---------- 第一步：只写 target/subtarget，建立基础骨架 ----------
          : > .config
          cat >> .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          EOF

          make defconfig

          echo "----- 第一轮：target 是否命中 -----"
          grep -E "^CONFIG_TARGET_(airoha|airoha_an7581|ARCH|BOARD|SUBTARGET)" .config | head -10
          if ! grep -q "^CONFIG_TARGET_airoha_an7581=y" .config; then
            echo "::error::target airoha_an7581 未被选中，内核/设备树可能不支持"
            grep -i "airoha" .config | head -20 || true
            exit 1
          fi

          # ---------- 第二步：锁定设备 ----------
          # 上游 target-metadata.pl 默认开启 TARGET_MULTI_PROFILE，
          # 因此设备符号只有一个合法形式：
          #   CONFIG_TARGET_<board>_<sub>_DEVICE_<设备名>=y
          # TARGET_PROFILE 是推导结果，形如 "DEVICE_airoha_an7581-evb"，
          # 不要手写、也不要关 MULTI_PROFILE（关掉会让设备选择全部失效）。
          echo "----- 第一轮默认设备行 -----"
          grep -E "^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y" .config | head -5 || true

          # 1) 关掉所有已选中的设备（含默认 evb）——用 awk 做字面量处理，避免正则转义问题
          awk -v pfx="CONFIG_TARGET_airoha_an7581_DEVICE_" '
            index($0, pfx) == 1 && substr($0, length($0)-1) == "=y" {
              name = substr($0, length(pfx)+1, length($0)-length(pfx)-2)
              print "# " pfx name " is not set"
              next
            }
            { print }
          ' .config > .config.tmp && mv .config.tmp .config

          # 2) 打开目标设备
          sed -i "s|^# CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_NAME} is not set|CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_NAME}=y|" .config
          grep -qx "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_NAME}=y" .config \
            || echo "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_NAME}=y" >> .config

          # 3) 删除旧的 TARGET_PROFILE，让 defconfig 依据设备符号重新推导
          sed -i '/^CONFIG_TARGET_PROFILE=/d' .config

          echo "----- 改写后设备行 -----"
          grep -E "^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y" .config | head -5 || true

          # ---------- 第三步：追加插件清单并重建 ----------
          grep -vE '^CONFIG_TARGET_(DEVICE|PROFILE|ALL_PROFILES|MULTI_PROFILE)' \
            "$GITHUB_WORKSPACE/$CONFIG_FILE" >> .config

          if [ -n "${{ inputs.extra_packages }}" ]; then
            for p in ${{ inputs.extra_packages }}; do
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "追加插件: $p"
            done
          fi

          make defconfig

          echo "----- 设备选择结果 -----"
          grep -E "^CONFIG_TARGET_PROFILE=|^CONFIG_TARGET_airoha_an7581_.*=y" .config | head -10

          # ---------- 校验 ----------
          # 以 CONFIG_TARGET_airoha_an7581_DEVICE_<设备>=y 为准
          if grep -qx "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE_NAME}=y" .config; then
            ACTUAL_PROFILE=$(grep -oP '^CONFIG_TARGET_PROFILE="\K[^"]+' .config | head -1)
            echo "✅ 机型校验通过: ${DEVICE_NAME} (TARGET_PROFILE=${ACTUAL_PROFILE:-空})"
          else
            echo "::error::设备 ${DEVICE_NAME} 未被选中"
            echo "--- TARGET_PROFILE ---"; grep -E "^CONFIG_TARGET_PROFILE=" .config || echo "(空)"
            echo "--- 所有 an7581 相关 ---"; grep -i "an7581" .config | head -30 || true
            exit 1
          fi

      - name: 开启 NPU / PPE 流量统计
        if: ${{ inputs.enable_npu_stats != false }}
        run: |
          cd lede
          # LEDE 的内核配置位于 target/linux/<target>/<subtarget>/config-*
          CFG=$(ls target/linux/airoha/an7581/config-* 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::未找到 airoha/an7581 内核配置"
            exit 1
          fi
          echo "目标内核配置: $CFG"

          set_kopt() {
            k="$1"; v="$2"
            if grep -q "^# ${k} is not set" "$CFG"; then
              sed -i "s|^# ${k} is not set|${k}=${v}|" "$CFG"
            elif grep -q "^${k}=" "$CFG"; then
              sed -i "s|^${k}=.*|${k}=${v}|" "$CFG"
            else
              echo "${k}=${v}" >> "$CFG"
            fi
          }

          # NPU 驱动（LEDE 默认已开，此处显式确保）
          set_kopt CONFIG_NET_AIROHA_NPU y
          # PPE / Frame Engine 流量统计（LEDE 默认关闭，必须打开）
          set_kopt CONFIG_NET_AIROHA_FLOW_STATS y
          # CPU 调频
          set_kopt CONFIG_ARM_AIROHA_SOC_CPUFREQ y

          echo "----- 修改后的 AIROHA 相关选项 -----"
          grep -i "NET_AIROHA\|AIROHA_SOC_CPUFREQ" "$CFG"

          # 硬校验：必须真的改成功，否则直接失败，避免"编译成功但功能没有"
          for k in CONFIG_NET_AIROHA_NPU CONFIG_NET_AIROHA_FLOW_STATS CONFIG_ARM_AIROHA_SOC_CPUFREQ; do
            if ! grep -qx "${k}=y" "$CFG"; then
              echo "::error::${k} 未能开启"
              exit 1
            fi
          done
          echo "✅ NPU 驱动 + PPE 统计 + CPUFREQ 内核选项均已确认 =y"

      - name: 插件命中校验
        run: |
          cd lede
          miss=0; total=0
          while read -r p; do
            total=$((total+1))
            if grep -q "^CONFIG_PACKAGE_$p=y" .config; then
              echo "  OK   $p"
            else
              echo "  MISS $p"; miss=$((miss+1))
            fi
          done < <(grep -oP '^CONFIG_PACKAGE_\K[\w.+-]+(?==y)' "$GITHUB_WORKSPACE/$CONFIG_FILE")
          echo "::notice::插件共 ${total} 个，未命中 ${miss} 个（MISS 通常为包名不存在，不影响编译）"

      - name: 预置 OpenClash 内核（mihomo）
        run: |
          cd lede
          COREDIR=files/etc/openclash/core
          mkdir -p "$COREDIR"

          TAG=$(curl -s --max-time 60 "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
                | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          [ -z "$TAG" ] && TAG="v1.19.33"
          echo "mihomo 版本: $TAG"

          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-arm64-${TAG}.gz"
          ok=0
          for attempt in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
                 -o /tmp/mihomo.gz "$URL" && [ -s /tmp/mihomo.gz ] && gzip -t /tmp/mihomo.gz 2>/dev/null; then
              ok=1; break
            fi
            echo "第 ${attempt} 次下载失败，重试…"; sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::${TAG} 下载失败，回退 v1.19.33"
            curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 600 \
              -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-arm64-v1.19.33.gz" || true
          fi

          if [ ! -s /tmp/mihomo.gz ] || ! gzip -t /tmp/mihomo.gz 2>/dev/null; then
            echo "::error::内核下载失败或文件损坏"
            exit 1
          fi

          gunzip -c /tmp/mihomo.gz > "$COREDIR/clash_meta"
          chmod 0755 "$COREDIR/clash_meta"
          echo "$TAG" > "$COREDIR/version.txt"

          echo "----- 内核信息 -----"
          ls -lh "$COREDIR"
          file "$COREDIR/clash_meta" || true

      - name: 注入默认配置（Argon 主题 / flow offload）
        run: |
          cd lede
          mkdir -p files
          cp -rv "$GITHUB_WORKSPACE/files/." files/
          chmod +x files/etc/uci-defaults/*
          echo "----- uci-defaults -----"
          ls -l files/etc/uci-defaults/
          cat files/etc/uci-defaults/99-xg040gmd-init

      - name: 下载依赖源码
        run: |
          cd lede
          make download -j"$(nproc)" || make download -j1 V=s

      - name: 编译固件
        run: |
          cd lede
          if ! make -j"$(nproc)" V=s > build.log 2>&1; then
            echo "::error::编译失败，日志最后 200 行："
            tail -n 200 build.log
            exit 1
          fi
          tail -n 30 build.log

      - name: 产物功能校验（NPU / PPE / Argon）
        run: |
          cd lede
          echo "===== 1) 内核配置校验 ====="
          CFG=$(ls target/linux/airoha/an7581/config-* | head -1)
          grep -E "^CONFIG_NET_AIROHA_(NPU|FLOW_STATS)=y|^CONFIG_ARM_AIROHA_SOC_CPUFREQ=y" "$CFG" || {
            echo "::error::内核配置文件里 NPU/PPE/CPUFREQ 未全部开启"; exit 1; }

          echo "===== 2) .config 中相关包是否选中 ====="
          for p in luci-app-airoha-npu luci-app-cpufreq luci-theme-argon luci-app-argon-config luci-app-openclash luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-monitor kmod-nft-offload; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK   $p"
            else
              echo "::error::  MISS $p"
              exit 1
            fi
          done

          echo "===== 2c) QModem 全功能校验 ====="
          # qmodem 与 qmodem-next 互斥，必须 -next 生效、旧版关闭
          if grep -q "^CONFIG_PACKAGE_luci-app-qmodem=y" .config; then
            echo "::error::luci-app-qmodem 与 -next 冲突，旧版被选中"
            exit 1
          fi
          echo "  OK   旧版 luci-app-qmodem 已关闭（使用 -next）"
          for p in qmodem qmodem-smsd libqmodem-sms luci-app-qmodem-sms sms-forwarder-next \
                   qmodem_monitor luci-app-qmodem-monitor luci-app-qmodem-mwan luci-app-mwan3 \
                   luci-app-qmodem-ttl luci-app-qmodem-ttlfw4 qmodem-uplink-manager \
                   luci-app-qmodem-uplink qmodem-voip qmodem-sipd luci-app-qmodem-voip \
                   qmodem-settings tom_modem ubus-at-daemon libsqlite3; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK   $p"
            else
              echo "::warning::  MISS $p（该 feed 可能无此包名，不影响主功能）"
            fi
          done

          echo "===== 2b) NPU 面板必需依赖 ====="
          # devmem：Frame Engine 寄存器 + CPU 超频
          if grep -qE "^CONFIG_(BUSYBOX_DEFAULT_DEVMEM|BUSYBOX_CONFIG_DEVMEM)=y" .config; then
            echo "  OK   devmem applet"
          else
            echo "::warning::devmem 未在 .config 中启用，Frame Engine / 超频可能不可用"
            grep -i "devmem" .config || true
          fi
          # debugfs：PPE 流程表
          if grep -qE "^CONFIG_KERNEL_DEBUG_FS=y|^CONFIG_DEBUG_FS=y" .config; then
            echo "  OK   debugfs"
          else
            echo "::warning::debugfs 未确认启用"
          fi
          # 内核选项
          CFG2=$(ls target/linux/airoha/an7581/config-* | head -1)
          grep -q "^CONFIG_NET_AIROHA_FLOW_STATS=y" "$CFG2" \
            && echo "  OK   NET_AIROHA_FLOW_STATS（PPE 数据源）" \
            || { echo "::error::PPE 统计未开启"; exit 1; }

          echo "===== 3) 固件内文件校验 ====="
          ROOTFS=$(ls bin/targets/airoha/an7581/*rootfs*.bin 2>/dev/null | head -1)
          echo "rootfs: $ROOTFS"
          if [ -n "$ROOTFS" ]; then
            # squashfs 用 unsquashfs 列目录检查关键文件
            if command -v unsquashfs >/dev/null 2>&1; then
              unsquashfs -l "$ROOTFS" 2>/dev/null > /tmp/fslist.txt || true
              for f in \
                "usr/lib/lua/luci/controller/airoha_npu.lua" \
                "etc/uci-defaults/99-hg5585f-init" \
                "www/luci-static/argon" \
                "etc/openclash/core/clash_meta"; do
                if grep -q "$f" /tmp/fslist.txt 2>/dev/null; then
                  echo "  OK   /$f"
                else
                  echo "  WARN /$f 未找到（路径可能因版本而异）"
                fi
              done
            else
              echo "unsquashfs 不可用，跳过文件级校验"
            fi
          fi

          echo "===== 4) 编译产物中 内核模块 校验 ====="
          ls -lh bin/targets/airoha/an7581/packages/ 2>/dev/null | head -20 || true

      - name: 整理产物并按规则重命名
        run: |
          cd lede
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          DATE=$(date +%Y%m%d)
          BUILDNO="${{ github.run_number }}"

          echo "命名前缀: HG5585F_LEDE_${DATE}_b${BUILDNO}"

          # HG5585F 上游 IMAGES := sysupgrade.itb，产物文件名形如：
          #   openwrt-airoha-an7581-fiberhome_hg5585f-ct-squashfs-sysupgrade.itb
          #   openwrt-airoha-an7581-fiberhome_hg5585f-ct-initramfs-recovery.itb
          found=0
          for f in bin/targets/airoha/an7581/*hg5585f-ct*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *sha256sums*|*.buildinfo|*.manifest) continue ;;
              *initramfs*|*recovery*) kind="recovery.itb" ;;
              *sysupgrade.itb)        kind="sysupgrade.itb" ;;
              *rootfs*)               kind="rootfs.itb" ;;
              *.itb)                  kind="image.itb" ;;
              *)                      kind="${base##*.}" ;;
            esac
            NEW="HG5585F_LEDE_${DATE}_b${BUILDNO}_${kind}"
            cp -v "$f" "$OUT/$NEW"
            echo "  重命名: $base -> $NEW"
            found=1
          done

          if [ "$found" != "1" ]; then
            echo "::error::未生成 fiberhome_hg5585f-ct 镜像，编译产物如下："
            ls -l bin/targets/airoha/an7581/ || true
            exit 1
          fi

          cd "$OUT"
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/lede/.config config-used.txt 2>/dev/null || true
          echo "----- 最终产物 -----"; ls -lh
          echo "----- 原始 itb -----"
          ls -lh "$GITHUB_WORKSPACE"/lede/bin/targets/airoha/an7581/*.itb 2>/dev/null || true

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HG5585F_LEDE_${{ github.run_number }}
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: HG5585F_LEDE_b${{ github.run_number }}
          name: HG5585F LEDE b${{ github.run_number }} (${{ env.LEDE_SHORT }})
          body: |
            **FiberHome HG5585F (CT 电信版)** (Airoha AN7581) — Lean LEDE 固件

            - LEDE 上游提交: `${{ env.LEDE_SHORT }}` (${{ env.LEDE_DATE }})
            - 设备符号: `CONFIG_TARGET_airoha_an7581_fiberhome_hg5585f-ct`
            - OpenClash 内核已预置: mihomo arm64
            - NPU: `CONFIG_NET_AIROHA_NPU=y`
            - PPE 统计: `CONFIG_NET_AIROHA_FLOW_STATS=y`
            - CPU 调频: `CONFIG_ARM_AIROHA_SOC_CPUFREQ=y`

            ⚠️ 刷机前务必备份 `factory` 分区（PON/WiFi 校准 + MAC + SN，丢失不可恢复）。
          files: out/*
          fail_on_unmatched_files: true

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            lede/build.log
            lede/.config
          retention-days: 7
